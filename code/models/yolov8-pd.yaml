# YOLOv8-PD (pavement distress) — reconstruction of Zeng & Zhong, Sci Rep 14, 12052 (2024), Figure 2.
# Backbone: standard YOLOv8n + BOT + LSKA appended after SPPF.
# Neck: standard YOLOv8 PANet topology with C2f -> C2fGhost, and an LSKA block
#       inserted after every C2fGhost.
# Head: LSCD-Head (lightweight shared-convolution detection head) instead of the
#       stock Detect head.
#
# Requires custom_modules.patch_ultralytics() to be called before this file is loaded.

nc: 6  # N-RDD2024 Asia 6 kelas: Longitudinal_Crack, Transverse_Crack, Alligator_Crack, Pothole, manhole, patchy_road
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4 (P3 tap)
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6 (P4 tap)
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 1, BoT, [1024]]           # 10  (Fig 5)
  - [-1, 1, LSKA, [1024]]          # 11  (Fig 6) - backbone output / P5 tap

# Head (neck + LSCD-Head)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 6], 1, Concat, [1]]                    # 13  cat backbone P4
  - [-1, 3, C2fGhost, [512]]                     # 14  (Fig 10)
  - [-1, 1, LSKA, [512]]                         # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 4], 1, Concat, [1]]                    # 17  cat backbone P3
  - [-1, 3, C2fGhost, [256]]                     # 18
  - [-1, 1, LSKA, [256]]                         # 19  -> P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]                   # 20
  - [[-1, 15], 1, Concat, [1]]                   # 21  cat head P4
  - [-1, 3, C2fGhost, [512]]                     # 22
  - [-1, 1, LSKA, [512]]                         # 23  -> P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                   # 24
  - [[-1, 11], 1, Concat, [1]]                   # 25  cat backbone P5
  - [-1, 3, C2fGhost, [1024]]                    # 26
  - [-1, 1, LSKA, [1024]]                        # 27  -> P5/32-large

  - [[19, 23, 27], 1, LSCDHead, [nc]]            # 28  Detect(P3, P4, P5) — Fig 11
